# ==============================================================================
# BloodConnect — Spring Boot Configuration
# ==============================================================================

server.port=${PORT:8080}
server.address=0.0.0.0
spring.application.name=bloodconnect-backend

# ------------------------------------------------------------------------------
# MySQL Database Connection (Primary)
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bloodconnect_db}?sslmode=require
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# JPA / Hibernate Configuration
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


